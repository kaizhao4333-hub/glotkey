<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Glotkey: typing practice in English, Chinese (pinyin), Japanese (romaji), Korean (romanization), French, Spanish and German.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d7a64%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3EG%3C/text%3E%3C/svg%3E">
<title>Glotkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+JP:wght@400&family=Noto+Serif+KR:wght@400&display=swap">
<style>
/* Layout: one centered column — header, config strip, a typing stage of N lines, results replace the stage.
   Six presets (data-style) + a custom layer written as inline tokens on :root. */
:root {
  --bg:#f4f5f3; --surface:#ffffff; --fg:#1b201e; --dim:#a7aeaa; --muted:#68716d;
  --accent:#0d7a64; --accent-ink:#ffffff; --error:#d63b3b; --error-bg:rgba(214,59,59,.13); --line:#e1e4e1;
  --panel:var(--surface); --panel-border:transparent; --panel-blur:0px; --panel-radius:8px;
  --b1:#0d7a64; --b2:#7aa9ff; --b3:#ffb59a;
  --ui-cjk:"Noto Sans SC"; --ui-cjk-serif:"Noto Serif SC";
  --font-ui:var(--ui-cjk), system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"DM Mono", var(--ui-cjk), ui-monospace, monospace;
  --latin:"DM Mono"; --cjk-sc:"Noto Sans SC"; --cjk-jp:"Noto Sans JP"; --cjk-kr:"Noto Sans KR";
  --text-size:1.65rem; --radius:8px; --mark-radius:7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141716; --surface:#1c201f; --fg:#e7ebe9; --dim:#4f5754; --muted:#8d9692;
    --accent:#4ed6b4; --accent-ink:#0f1513; --error:#ff6b6b; --error-bg:rgba(255,107,107,.16); --line:#2a302e;
    --b1:#4ed6b4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#141716; --surface:#1c201f; --fg:#e7ebe9; --dim:#4f5754; --muted:#8d9692;
  --accent:#4ed6b4; --accent-ink:#0f1513; --error:#ff6b6b; --error-bg:rgba(255,107,107,.16); --line:#2a302e;
  --b1:#4ed6b4; color-scheme: dark;
}

/* 画廊 Gallery — museum wall, editorial serif, Klein blue */
:root[data-style="gallery"] {
  --bg:#f1f1ee; --surface:#ffffff; --fg:#0f0f10; --dim:#bdbdb7; --muted:#6b6b67;
  --accent:#1335b8; --accent-ink:#ffffff; --error:#d23c2c; --error-bg:rgba(210,60,44,.1); --line:#d6d6d0;
  --panel:transparent; --panel-border:transparent; --panel-radius:0;
  --font-ui:"Manrope", var(--ui-cjk), sans-serif;
  --font-display:"Instrument Serif", "Noto Serif SC", serif;
  --latin:"Fraunces"; --cjk-sc:"Noto Serif SC"; --cjk-jp:"Noto Serif JP"; --cjk-kr:"Noto Serif KR";
  --text-size:2rem; --radius:0; --mark-radius:50%; color-scheme:light;
}
/* 曜石 Obsidian — black stone, ivory serif, champagne gold */
:root[data-style="obsidian"] {
  --bg:#0b0b0d; --surface:#141416; --fg:#efe8da; --dim:#4c4840; --muted:#9a9284;
  --accent:#cfae6e; --accent-ink:#0b0b0d; --error:#e2735e; --error-bg:rgba(226,115,94,.15); --line:#26241f;
  --panel:transparent; --panel-border:#26241f; --panel-radius:0;
  --b1:#cfae6e; --b2:#5c4a2a; --b3:#2a2620;
  --font-ui:"Manrope", var(--ui-cjk), sans-serif;
  --font-display:"Cormorant Garamond", "Noto Serif SC", serif;
  --latin:"Cormorant Garamond"; --cjk-sc:"Noto Serif SC"; --cjk-jp:"Noto Serif JP"; --cjk-kr:"Noto Serif KR";
  --text-size:2.25rem; --radius:0; --mark-radius:0; color-scheme:dark;
}
/* 极光 Aurora — night sky, drifting light, frosted glass */
:root[data-style="aurora"] {
  --bg:#060912; --surface:rgba(255,255,255,.05); --fg:#eef1fa; --dim:#3f4862; --muted:#8e98b4;
  --accent:#7fe3d1; --accent-ink:#06121a; --error:#ff7a8a; --error-bg:rgba(255,122,138,.16); --line:rgba(255,255,255,.1);
  --panel:rgba(255,255,255,.045); --panel-border:rgba(255,255,255,.09); --panel-blur:18px; --panel-radius:16px;
  --b1:#1fb5a3; --b2:#5b4fe0; --b3:#b0408a;
  --font-ui:"Manrope", var(--ui-cjk), sans-serif;
  --font-display:"Manrope", "Noto Sans SC", sans-serif;
  --latin:"JetBrains Mono";
  --radius:10px; --mark-radius:10px; color-scheme:dark;
}
/* 晨雾 Dawn — pale morning haze, soft glass, italic serif */
:root[data-style="dawn"] {
  --bg:#f4f2f7; --surface:rgba(255,255,255,.62); --fg:#26212f; --dim:#bdb5c9; --muted:#766e85;
  --accent:#b4466a; --accent-ink:#ffffff; --error:#d1432f; --error-bg:rgba(209,67,47,.12); --line:rgba(38,33,47,.1);
  --panel:rgba(255,255,255,.55); --panel-border:rgba(255,255,255,.8); --panel-blur:20px; --panel-radius:18px;
  --b1:#ffd0bd; --b2:#d9caff; --b3:#c4e4ff;
  --font-ui:"Manrope", var(--ui-cjk), sans-serif;
  --font-display:"Fraunces", "Noto Serif SC", serif;
  --latin:"DM Mono";
  --radius:12px; --mark-radius:50%; color-scheme:light;
}
/* 青瓷 Celadon — glaze green-grey, ink teal, wide-tracked serif */
:root[data-style="celadon"] {
  --bg:#dce5df; --surface:#e7eee9; --fg:#1b2a29; --dim:#98aea6; --muted:#53706a;
  --accent:#1f5961; --accent-ink:#ffffff; --error:#a8432f; --error-bg:rgba(168,67,47,.12); --line:#bdccc4;
  --panel:transparent; --panel-border:#bdccc4; --panel-radius:2px;
  --font-ui:var(--ui-cjk-serif), serif;
  --font-display:var(--ui-cjk-serif), "Noto Serif SC", serif;
  --latin:"IBM Plex Mono"; --cjk-sc:"Noto Serif SC"; --cjk-jp:"Noto Serif JP"; --cjk-kr:"Noto Serif KR";
  --radius:2px; --mark-radius:2px; color-scheme:light;
}

:root[data-ui="ja"] { --ui-cjk:"Noto Sans JP"; --ui-cjk-serif:"Noto Serif JP"; }
:root[data-ui="ko"] { --ui-cjk:"Noto Sans KR"; --ui-cjk-serif:"Noto Serif KR"; }
[hidden] { display:none !important; }
html, body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-ui); font-size:15px;
  transition:background-color .35s, color .35s;
}
:root[data-style="obsidian"] body { background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(207,174,110,.13), transparent 70%) var(--bg); }
:root[data-style="celadon"] body { background:radial-gradient(circle at 15% 0%, rgba(255,255,255,.6), transparent 45%) var(--bg); }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* ambient layer */
.fx { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.fx i { position:absolute; border-radius:50%; filter:blur(90px); opacity:0; transition:opacity .6s; }
.fx .b1 { width:52vmax; height:52vmax; left:-14vmax; top:-22vmax; background:var(--b1); }
.fx .b2 { width:46vmax; height:46vmax; right:-16vmax; top:8vmax; background:var(--b2); }
.fx .b3 { width:40vmax; height:40vmax; left:22vmax; bottom:-26vmax; background:var(--b3); }
:root[data-fx~="blobs"] .fx i { opacity:.42; animation:drift 26s ease-in-out infinite alternate; }
:root[data-fx~="blobs"] .fx .b2 { animation-duration:32s; animation-direction:alternate-reverse; }
:root[data-fx~="blobs"] .fx .b3 { animation-duration:38s; }
:root[data-style="dawn"][data-fx~="blobs"] .fx i { opacity:.75; }
.fx .grain {
  position:absolute; inset:-50%; opacity:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
:root[data-fx~="grain"] .fx .grain { opacity:.14; }
@keyframes drift { to { transform:translate(8vmax, 6vmax) scale(1.12); } }

.app {
  max-width:1060px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column; gap:24px;
  padding-block:28px 22px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  box-sizing:border-box;
}

/* header */
.top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; transition:opacity .3s; }
:root[data-style="gallery"] .top { padding-bottom:18px; border-bottom:1px solid var(--fg); }
.brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
.mark {
  display:inline-grid; place-items:center; width:30px; height:30px; font-size:1rem; flex:none;
  background:var(--accent); color:var(--accent-ink); border-radius:var(--mark-radius); font-family:var(--font-ui); font-weight:600;
}
:root[data-style="obsidian"] .mark, :root[data-style="celadon"] .mark { background:transparent; color:var(--accent); border:1px solid var(--accent); }
:root[data-style="aurora"] .mark { background:linear-gradient(135deg, var(--b1), var(--b2)); color:#fff; }
:root[data-style="dawn"] .mark { background:linear-gradient(135deg, #f3a58a, var(--accent)); }
.logo { font-family:var(--font-display); font-size:1.55rem; font-weight:500; letter-spacing:-.01em; line-height:1; }
:root[data-style="gallery"] .logo { font-size:2.2rem; font-style:italic; font-weight:400; letter-spacing:-.02em; }
:root[data-style="obsidian"] .logo { font-size:1.9rem; letter-spacing:.14em; text-transform:uppercase; font-weight:500; }
:root[data-style="aurora"] .logo { font-weight:700; letter-spacing:-.03em; }
:root[data-style="dawn"] .logo { font-size:1.9rem; font-style:italic; font-weight:400; }
:root[data-style="celadon"] .logo { letter-spacing:.22em; font-weight:600; font-size:1.3rem; }
.brand-sub { color:var(--muted); font-size:.82rem; letter-spacing:.06em; }

.styles { display:flex; gap:4px; flex-wrap:wrap; }
.sty {
  display:flex; align-items:center; gap:7px; padding:5px 10px 5px 6px; cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:999px; color:var(--muted); font-size:.82rem;
}
.sty:hover { color:var(--fg); }
.sty[aria-pressed="true"] { border-color:var(--line); color:var(--fg); background:var(--panel); }
.sw { width:18px; height:18px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(128,128,128,.35); }
.icon-btn {
  display:flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--line);
  background:transparent; border-radius:999px; cursor:pointer; color:var(--muted); font-size:.82rem;
}
.icon-btn:hover { color:var(--fg); }
.icon-btn[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
.ui-lang { position:relative; display:flex; align-items:center; }
.ui-lang svg { position:absolute; left:10px; width:15px; height:15px; pointer-events:none; color:var(--muted); fill:none; stroke:currentColor; stroke-width:1.7; }
.ui-lang select {
  appearance:none; -webkit-appearance:none; cursor:pointer; font-size:.82rem; color:var(--fg);
  background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 30px;
}
.ui-lang select:hover { border-color:var(--accent); }
.ui-lang option { background:var(--bg); color:var(--fg); }
.icon-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* config strip */
.config {
  display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; padding:10px 14px;
  background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--panel-radius);
  -webkit-backdrop-filter:blur(var(--panel-blur)); backdrop-filter:blur(var(--panel-blur));
  transition:opacity .3s;
}
:root[data-style="gallery"] .config { padding:4px 0; }
.grp { display:flex; align-items:center; gap:2px; flex-wrap:wrap; }
.grp-l { color:var(--dim); font-size:.7rem; letter-spacing:.14em; margin-right:6px; text-transform:uppercase; }
.opt {
  background:transparent; border:0; padding:5px 9px; border-radius:999px; cursor:pointer;
  color:var(--muted); font-size:.88rem; transition:color .15s, background-color .15s;
}
.opt:hover { color:var(--fg); }
.opt[aria-pressed="true"] { color:var(--accent); font-weight:600; background:color-mix(in srgb, var(--accent) 12%, transparent); }
:root[data-style="gallery"] .opt[aria-pressed="true"], :root[data-style="obsidian"] .opt[aria-pressed="true"], :root[data-style="celadon"] .opt[aria-pressed="true"] {
  background:transparent; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:6px;
}
.opt.tog::before { content:"○ "; }
.opt.tog[aria-pressed="true"]::before { content:"● "; }

/* stage */
.stage { position:relative; padding-block:30px 8px; cursor:text; }
.live {
  display:flex; align-items:baseline; gap:18px; min-height:2.2rem; margin-bottom:16px;
  font-family:var(--font-display); font-variant-numeric:tabular-nums;
}
.live-main { font-size:1.9rem; color:var(--accent); line-height:1; }
:root[data-style="gallery"] .live-main, :root[data-style="dawn"] .live-main { font-size:2.6rem; font-style:italic; }
:root[data-style="obsidian"] .live-main { font-size:2.6rem; }
.live-speed { color:var(--muted); font-size:1rem; font-family:var(--font-ui); }
.live-unit { color:var(--dim); font-size:.75rem; margin-left:4px; letter-spacing:.08em; }
.words {
  position:relative; overflow:hidden; font-size:var(--text-size); line-height:1.35;
  font-family:var(--latin), var(--cjk-sc), ui-monospace, monospace;
  transition:filter .25s, opacity .25s;
}
.inner {
  position:relative; display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:.42em;
  transition:transform .22s ease;
}
:root[data-align="center"] .inner { justify-content:center; }
.w { display:inline-flex; flex-direction:column; align-items:flex-start; }
.hint {
  font-size:.56em; line-height:1.35; color:var(--muted); font-family:var(--cjk-sc), sans-serif;
  white-space:nowrap; padding-left:.08em; padding-right:.4em; letter-spacing:.02em;
}
.words[data-lang="ja"] .hint { font-family:var(--cjk-jp), sans-serif; }
.words[data-lang="ko"] .hint { font-family:var(--cjk-kr), sans-serif; }
:root[data-style="obsidian"] .hint { font-size:.46em; }
.cs { display:flex; }
.c { white-space:pre; color:var(--dim); transition:color .07s; }
.c.ok { color:var(--fg); }
.c.bad { color:var(--error); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:.18em; }
.c.sp.bad { background:var(--error-bg); }
:root[data-style="aurora"] .c.ok { text-shadow:0 0 14px rgba(127,227,209,.25); }

.caret {
  position:absolute; left:0; top:0; width:2px; height:var(--ch, 1.3em); background:var(--accent);
  border-radius:1px; pointer-events:none; z-index:2;
  transition:left .09s cubic-bezier(.3,.7,.4,1), top .09s cubic-bezier(.3,.7,.4,1);
}
:root[data-smooth="off"] .caret { transition:none; }
:root[data-caret="block"] .caret { width:var(--cw, .6em); opacity:.3; border-radius:3px; }
:root[data-caret="underline"] .caret { width:var(--cw, .6em); height:2px; margin-top:calc(var(--ch, 1.3em) - 1px); }
:root[data-caret="none"] .caret { visibility:hidden; }
:root[data-style="aurora"] .caret { box-shadow:0 0 12px var(--accent); }
.caret.idle { animation:blink 1.05s step-end infinite; }
@keyframes blink { 50% { opacity:0; } }

.comp {
  position:absolute; z-index:5; padding:3px 9px; font-size:1rem; white-space:nowrap;
  background:var(--fg); color:var(--bg); border-radius:6px; pointer-events:none; transform:translateY(-100%);
}
#ta {
  position:absolute; left:0; top:0; width:3em; height:1.6em; opacity:0; padding:0; border:0;
  resize:none; overflow:hidden; color:transparent; background:transparent; caret-color:transparent;
  font-size:16px; z-index:-1;
}
.focus-hint {
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
  color:var(--fg); font-size:1rem; letter-spacing:.06em; opacity:0; transition:opacity .2s;
}
.stage:not(.focused) .focus-hint { opacity:1; }
.stage:not(.focused) .words { filter:blur(5px); opacity:.5; }
.stage:not(.focused) .caret { opacity:0; }

.tip { color:var(--muted); font-size:.85rem; margin:0; line-height:1.6; max-width:65ch; }
.tip.warn { color:var(--error); }
kbd {
  font-family:"DM Mono", ui-monospace, monospace; font-size:.78em; padding:1px 6px; border-radius:4px;
  background:var(--surface); border:1px solid var(--line); color:var(--fg);
}

/* results */
.results { display:flex; flex-direction:column; gap:24px; padding-block:6px; }
.res-head { display:flex; flex-wrap:wrap; gap:14px 48px; align-items:flex-end; }
.big { display:flex; flex-direction:column; gap:4px; }
.big .lbl { color:var(--muted); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; }
.big .num { font-family:var(--font-display); font-size:3.8rem; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums; }
:root[data-style="gallery"] .big .num, :root[data-style="dawn"] .big .num { font-size:5rem; font-style:italic; font-weight:400; }
:root[data-style="obsidian"] .big .num { font-size:5rem; font-weight:500; }
:root[data-style="aurora"] .big .num { font-weight:700; letter-spacing:-.04em; background:linear-gradient(120deg, var(--accent), #a9a2ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.big .num.sec { color:var(--fg); background:none; }
.badge { align-self:center; padding:4px 12px; border-radius:999px; font-size:.8rem; background:var(--accent); color:var(--accent-ink); }
.chart { width:100%; overflow-x:auto; }
.chart svg { display:block; width:100%; min-width:420px; height:auto; }
.chart .gl { stroke:var(--line); stroke-width:1; }
.chart .ax { fill:var(--muted); font-size:11px; font-family:"DM Mono", ui-monospace, monospace; }
.chart .l-sp { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.chart .a-sp { fill:var(--accent); opacity:.1; stroke:none; }
.chart .l-raw { fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 4; opacity:.7; }
.chart .er { fill:var(--error); stroke:var(--bg); stroke-width:1.5; }
.chart .end { fill:var(--accent); stroke:var(--bg); stroke-width:2; }
.legend { display:flex; gap:18px; color:var(--muted); font-size:.78rem; flex-wrap:wrap; margin-top:6px; }
.legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:6px; background:var(--accent); }
.legend i.raw { background:repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.legend i.er { width:8px; height:8px; border-radius:50%; background:var(--error); }
.res-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:16px; margin:0; }
.res-grid div { display:flex; flex-direction:column; gap:3px; }
.res-grid dt { color:var(--muted); font-size:.74rem; letter-spacing:.08em; }
.res-grid dd { margin:0; font-family:var(--font-display); font-size:1.45rem; font-variant-numeric:tabular-nums; }
.res-actions { display:flex; gap:10px; flex-wrap:wrap; }
.btn {
  padding:9px 18px; border-radius:999px; border:1px solid var(--accent); cursor:pointer;
  background:var(--accent); color:var(--accent-ink); font-size:.9rem;
}
:root[data-style="gallery"] .btn, :root[data-style="obsidian"] .btn, :root[data-style="celadon"] .btn { border-radius:0; }
.btn.ghost { background:transparent; color:var(--accent); }

.keys { margin-top:auto; color:var(--dim); font-size:.8rem; display:flex; gap:16px; flex-wrap:wrap; }
body.typing .top, body.typing .config, body.typing .tip:not(.warn), body.typing .keys { opacity:.1; }

/* customizer drawer */
.drawer {
  position:fixed; top:0; right:0; bottom:0; z-index:40; width:min(380px, 100%); box-sizing:border-box;
  background:var(--bg); border-left:1px solid var(--line); box-shadow:-24px 0 60px rgba(0,0,0,.12);
  overflow-y:auto; display:flex; flex-direction:column; gap:22px;
  padding:calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 22px;
}
.dr-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.dr-head h2 { margin:0; font-family:var(--font-display); font-size:1.35rem; font-weight:500; }
.dr-sec { display:flex; flex-direction:column; gap:10px; }
.dr-sec > h3 { margin:0; font-size:.7rem; letter-spacing:.16em; color:var(--muted); font-weight:600; text-transform:uppercase; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:.88rem; }
.row label, .row > span { color:var(--fg); }
.colors { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.colors label { display:flex; flex-direction:column; align-items:center; gap:5px; font-size:.72rem; color:var(--muted); cursor:pointer; }
.colors input[type="color"] {
  width:44px; height:44px; padding:0; border:1px solid var(--line); border-radius:50%; background:none; cursor:pointer; overflow:hidden;
}
.colors input[type="color"]::-webkit-color-swatch-wrapper { padding:0; }
.colors input[type="color"]::-webkit-color-swatch { border:0; border-radius:50%; }
.colors input[type="color"]::-moz-color-swatch { border:0; border-radius:50%; }
.seg { display:flex; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px; flex-wrap:wrap; }
.seg button { border:0; background:transparent; padding:5px 11px; border-radius:999px; cursor:pointer; color:var(--muted); font-size:.8rem; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.drawer select, .drawer input[type="text"] {
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:.86rem; min-width:0;
}
.drawer select { max-width:200px; }
.drawer input[type="range"] { accent-color:var(--accent); width:160px; }
.code-row { display:flex; gap:8px; }
.code-row input { flex:1; }
.mini { border:1px solid var(--line); background:transparent; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:.82rem; white-space:nowrap; }
.mini:hover { border-color:var(--accent); color:var(--accent); }
.note { color:var(--muted); font-size:.78rem; line-height:1.55; margin:0; }
.note.ok { color:var(--accent); }
.note.err { color:var(--error); }

/* layout switch */
.layout-sw { display:flex; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px; }
.layout-sw button {
  display:flex; align-items:center; gap:5px; border:0; background:transparent; cursor:pointer;
  padding:4px 10px; border-radius:999px; font-size:.78rem; color:var(--muted);
}
.layout-sw button:hover { color:var(--fg); }
.layout-sw button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
.layout-sw svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }

/* zen layout: only the text, the counter and the switch */
:root[data-layout="zen"] .brand-sub, :root[data-layout="zen"] .styles, :root[data-layout="zen"] #customBtn,
:root[data-layout="zen"] #soundBtn, :root[data-layout="zen"] .ui-lang, :root[data-layout="zen"] .tip,
:root[data-layout="zen"] .keys { display:none; }
:root[data-layout="zen"] #statsBtn span { display:none; }
:root[data-layout="zen"] .app { max-width:920px; }
:root[data-layout="zen"] .top { border-bottom:0; padding-bottom:0; }
:root[data-layout="zen"] .config {
  background:transparent; border-color:transparent; -webkit-backdrop-filter:none; backdrop-filter:none;
  justify-content:center; opacity:.4; transition:opacity .25s;
}
:root[data-layout="zen"] .config:hover, :root[data-layout="zen"] .config:focus-within { opacity:1; }
:root[data-layout="zen"] .stage { padding-block:9vh 8px; }
:root[data-layout="zen"] .live { justify-content:center; }
:root[data-layout="zen"] .grp-l { display:none; }

/* stats dashboard */
.statsv { display:flex; flex-direction:column; gap:22px; }
.sv-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.sv-head h2 { margin:0 0 4px; font-family:var(--font-display); font-size:1.9rem; font-weight:500; line-height:1.15; text-wrap:balance; }
:root[data-style="gallery"] .sv-head h2, :root[data-style="dawn"] .sv-head h2 { font-style:italic; font-weight:400; font-size:2.3rem; }
.sv-tabs { display:flex; gap:4px; flex-wrap:wrap; padding-bottom:10px; border-bottom:1px solid var(--line); }
.sv-tabs button {
  border:0; background:transparent; padding:6px 11px; border-radius:999px; cursor:pointer; color:var(--muted); font-size:.86rem;
}
.sv-tabs button:hover { color:var(--fg); }
.sv-tabs button[aria-selected="true"] { color:var(--accent); font-weight:600; background:color-mix(in srgb, var(--accent) 12%, transparent); }
.sv-tabs small { color:var(--dim); font-weight:400; margin-left:4px; font-variant-numeric:tabular-nums; }
.sv-body { display:flex; flex-direction:column; gap:26px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
.tile {
  display:flex; flex-direction:column; gap:6px; padding:14px 16px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--panel-radius);
  -webkit-backdrop-filter:blur(var(--panel-blur)); backdrop-filter:blur(var(--panel-blur));
}
.tile .k { color:var(--muted); font-size:.74rem; letter-spacing:.06em; }
.tile .v { font-family:var(--font-display); font-size:1.9rem; line-height:1.1; font-variant-numeric:tabular-nums; }
.tile .v small { font-size:.8rem; color:var(--muted); margin-left:4px; font-family:var(--font-ui); }
.tile.hi .v { color:var(--accent); }
.sv-grid { display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:28px; }
.card { display:flex; flex-direction:column; gap:10px; min-width:0; }
.card > h3 { margin:0; font-size:.72rem; letter-spacing:.14em; color:var(--muted); font-weight:600; text-transform:uppercase; }
.svchart svg { display:block; width:100%; height:auto; }
.svchart .gl { stroke:var(--line); stroke-width:1; }
.svchart .ax { fill:var(--muted); font-size:11px; font-family:"DM Mono", ui-monospace, monospace; }
.svchart .pt { fill:var(--accent); opacity:.45; }
.svchart .ma { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.svchart .bar { fill:var(--accent); opacity:.75; }
.svchart .bar.zero { opacity:.15; }
.tbl-wrap { overflow-x:auto; }
.sv-table { width:100%; border-collapse:collapse; font-size:.86rem; font-variant-numeric:tabular-nums; }
.sv-table th { text-align:left; color:var(--muted); font-weight:500; font-size:.74rem; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.sv-table td { padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.sv-table td.num, .sv-table th.num { text-align:right; }
.meter { position:relative; display:inline-block; width:70px; height:6px; border-radius:3px; background:var(--line); vertical-align:middle; margin-left:8px; overflow:hidden; }
.meter i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:3px; }
.miss-list { display:flex; flex-wrap:wrap; gap:8px; }
.miss { display:flex; align-items:baseline; gap:8px; padding:6px 11px; border:1px solid var(--line); border-radius:8px; }
.miss b { font-family:var(--latin), var(--cjk-sc), monospace; font-size:1.25rem; font-weight:500; color:var(--error); }
.miss span { color:var(--muted); font-size:.8rem; font-variant-numeric:tabular-nums; }
.sv-empty { padding:36px 0; color:var(--muted); font-size:.95rem; }
.sv-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding-top:4px; border-top:1px solid var(--line); padding-top:16px; }
.confirm { display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--error); font-size:.85rem; }
.mini.danger { border-color:var(--error); color:var(--error); }
#svDump { width:100%; min-height:70px; font-family:"DM Mono", monospace; font-size:.75rem; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
@media (max-width:760px) { .sv-grid { grid-template-columns:minmax(0, 1fr); } }

@media (max-width:1020px) {
  .brand-sub { display:none; }
  .layout-sw span { display:none; }
}
@media (max-width:640px) {
  :root { --text-size:1.3rem; }
  .icon-btn span { display:none; }
  .app { gap:16px; padding-block:18px; }
  .config { gap:6px 12px; padding:8px 10px; }
  .big .num { font-size:2.8rem !important; }
  .brand-sub { display:none; }
  .sty span.nm { display:none; }
  .drawer { width:100%; border-left:0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}
</style>
</head>

<div class="fx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><div class="grain"></div></div>

  <div class="dr-sec">

  </div>
</aside>

function niceMax(v) {
  if (v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));

  return 10 * p;

function drawChart(samples) {

  const t1 = Math.max(samples[n - 1].t, 1);
  const x = t => L + t / t1 * (W - L - R);

    const v = maxY * k / 4, yy = y(v).toFixed(1);

  }
  const stepT = t1 <= 20 ? 2 : t1 <= 40 ? 5 : t1 <= 90 ? 10 : 20;
  for (let t = stepT; t <= t1 + 0.01; t += stepT) g += `<text class="ax" x="${x(t).toFixed(1)}" y="${H - 8}" text-anchor="middle">${t}s</text>`;
  const pts = [{ t:0, sp:samples[0].sp, raw:samples[0].raw }].concat(samples);
  const path = key => pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p[key]).toFixed(1)).join(' ');
  const sp = path('sp');
  const area = sp + ` L${x(pts[pts.length - 1].t).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  let dots = '';
  samples.forEach(s => { if (s.err) dots += `<circle class="er" cx="${x(s.t).toFixed(1)}" cy="${y(s.sp).toFixed(1)}" r="${Math.min(3 + s.err, 6)}"><title>${t('errAt', { s:s.t, n:s.err })}</title></circle>`; });
  const last = samples[n - 1];
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartAria')}">${g}<path class="a-sp" d="${area}"/><path class="l-raw" d="${path('raw')}"/><path class="l-sp" d="${sp}"/>${dots}<circle class="end" cx="${x(last.t).toFixed(1)}" cy="${y(last.sp).toFixed(1)}" r="4.5"/></svg>`;
}

  const step = n <= 10 ? 1 : n <= 25 ? 5 : 10;
  for (let i = 0; i < n; i += step) g += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  const pts = vals.map((v, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5"><title>${esc(fmtDate(list[i].t))} · ${Math.round(v)} WPM</title></circle>`).join('');
  const line = n > 1 ? `<path class="ma" d="${ma.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ')}"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('trend'))}">${g}${pts}${line}</svg>`;
}
function activityChart(list) {
  const days = 30, W = 640, H = 150, L = 30, R = 8, T = 10, B = 22;
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (days - 1));
  const mins = new Array(days).fill(0);
  list.forEach(r => { const d = Math.floor((r.t - start.getTime()) / 864e5); if (d >= 0 && d < days) mins[d] += r.secs / 60; });
  const maxY = niceMax(Math.max(...mins, 5));
  const bw = (W - L - R) / days;
  const y = v => T + (1 - v / maxY) * (H - T - B);
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const v = maxY * k / 2, yy = y(v).toFixed(1);
    g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 6}" y="${+yy + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  mins.forEach((m, i) => {
    const d = new Date(start.getTime() + i * 864e5);
    const h = Math.max(m > 0 ? 2 : 1.5, y(0) - y(m));
    g += `<rect class="bar${m > 0 ? '' : ' zero'}" x="${(L + i * bw + 1.5).toFixed(1)}" y="${(y(0) - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"><title>${d.getMonth() + 1}/${d.getDate()} · ${m.toFixed(1)}</title></rect>`;
    if ((i % 7 === 0 && days - 1 - i >= 4) || i === days - 1) g += `<text class="ax" x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${d.getMonth() + 1}/${d.getDate()}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('activity'))}">${g}</svg>`;
}
function tilesHtml(list) {
  const last10 = list.slice(-10);
  const tile = (k, v, hi) => `<div class="tile${hi ? ' hi' : ''}"><span class="k">${esc(t(k))}</span><span class="v">${v}</span></div>`;
  return `<div class="tiles">
    ${tile('sBest', `${Math.round(Math.max(...list.map(r => r.wpm)))}<small>WPM</small>`, true)}
    ${tile('sAvg10', `${Math.round(avg(last10.map(r => r.wpm)))}<small>WPM</small>`)}
    ${tile('sAcc', `${Math.round(avg(list.map(r => r.acc)))}<small>%</small>`)}
    ${tile('sTests', list.length)}
    ${tile('sTime', esc(fmtDur(list.reduce((s, r) => s + r.secs, 0))))}
    ${tile('sChars', list.reduce((s, r) => s + r.ok, 0).toLocaleString())}
  </div>`;
}
function renderStats() {
  const all = store.get(HKEY, []);
  const counts = {}; all.forEach(r => { counts[r.lang] = (counts[r.lang] || 0) + 1; });
  const tabs = $('#svTabs'); tabs.textContent = '';
  [['all', t('allLangs'), all.length]].concat(Object.keys(LANGS).map(k => [k, LANGS[k].name, counts[k] || 0])).forEach(([k, name, n]) => {
    const b = document.createElement('button'); b.type = 'button'; b.id = 'svtab-' + k;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(statsLang === k));
    b.innerHTML = `${esc(name)}<small>${n}</small>`;
    b.addEventListener('click', () => { statsLang = k; renderStats(); });
    tabs.appendChild(b);
  });
  const body = $('#svBody');
  const list = statsLang === 'all' ? all : all.filter(r => r.lang === statsLang);
  if (!list.length) { body.innerHTML = `<p class="sv-empty">${esc(t('empty'))}</p>`; return; }

  const m = store.get(MKEY, {});
  const merged = {};
  (statsLang === 'all' ? Object.values(m) : [m[statsLang] || {}]).forEach(o => { for (const c in o) merged[c] = (merged[c] || 0) + o[c]; });
  const top = Object.entries(merged).sort((a, b) => b[1] - a[1]).slice(0, 14);
  const missHtml = top.length
    ? `<div class="miss-list">${top.map(([c, n]) => `<span class="miss"><b>${c === ' ' ? '␣' : esc(c)}</b><span>×${n}</span></span>`).join('')}</div><p class="note">${esc(t('missNote'))}</p>`
    : `<p class="note">—</p>`;

  let langTable = '';
  if (statsLang === 'all') {
    const rows = Object.keys(LANGS).map(k => [k, all.filter(r => r.lang === k)]).filter(x => x[1].length);
    const top = Math.max(...rows.map(([, l]) => Math.max(...l.map(r => r.wpm))), 1);
    langTable = `<div class="card"><h3>${esc(t('byLang'))}</h3><div class="tbl-wrap"><table class="sv-table">
      <thead><tr><th>${esc(t('colLang'))}</th><th class="num">${esc(t('sBest'))}</th><th class="num">${esc(t('sAvg10'))}</th><th class="num">${esc(t('sAcc'))}</th><th class="num">${esc(t('sTests'))}</th><th class="num">${esc(t('sTime'))}</th></tr></thead>
      <tbody>${rows.map(([k, l]) => { const b = Math.max(...l.map(r => r.wpm)); return `<tr>
        <td>${esc(LANGS[k].name)}</td>
        <td class="num">${Math.round(b)}<span class="meter"><i style="width:${(b / top * 100).toFixed(0)}%"></i></span></td>
        <td class="num">${Math.round(avg(l.slice(-10).map(r => r.wpm)))}</td>
        <td class="num">${Math.round(avg(l.map(r => r.acc)))}%</td>
        <td class="num">${l.length}</td>
        <td class="num">${esc(fmtDur(l.reduce((s, r) => s + r.secs, 0)))}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  }

  const recent = list.slice(-10).reverse();
  const recentHtml = `<div class="card"><h3>${esc(t('recent'))}</h3><div class="tbl-wrap"><table class="sv-table">
    <thead><tr><th>${esc(t('colDate'))}</th>${statsLang === 'all' ? `<th>${esc(t('colLang'))}</th>` : ''}<th>${esc(t('setup'))}</th><th class="num">WPM</th><th class="num">${esc(t('accuracy'))}</th></tr></thead>
    <tbody>${recent.map(r => `<tr><td>${esc(fmtDate(r.t))}</td>${statsLang === 'all' ? `<td>${esc((LANGS[r.lang] || {}).name || r.lang)}</td>` : ''}<td>${esc(recSetup(r))}</td><td class="num">${Math.round(r.wpm)}</td><td class="num">${Math.round(r.acc)}%</td></tr>`).join('')}</tbody></table></div></div>`;

  body.innerHTML = `${tilesHtml(list)}
    <div class="sv-grid">
      <div class="card"><h3>${esc(t('trend'))}</h3><div class="svchart">${trendChart(list.slice(-50))}</div>
        <div class="legend"><span><i style="opacity:.45;width:8px;height:8px;border-radius:50%"></i>${esc(t('lgTest'))}</span><span><i></i>${esc(t('lgAvg'))}</span></div></div>
      <div class="card"><h3>${esc(t('misses'))}</h3>${missHtml}</div>
    </div>
    <div class="card"><h3>${esc(t('activity'))}</h3><div class="svchart">${activityChart(list)}</div></div>
    ${langTable}
    ${recentHtml}`;
}
const statsBtn = $('#statsBtn');
function openStats() {
  if (test && test.started && !test.finished) newTest(true);
  ta.blur(); clearInterval(timer); timer = null;
  stage.hidden = true; results.hidden = true; $('#tip').hidden = true; cfgEl.hidden = true;
  statsView.hidden = false; statsBtn.setAttribute('aria-pressed', 'true');
  $('#svConfirm').hidden = true; $('#svDump').hidden = true; $('#svMsg').textContent = '';
  if (statsLang !== 'all' && !LANGS[statsLang]) statsLang = 'all';
  renderStats();
  window.scrollTo(0, 0);
}
function closeStats() {
  statsView.hidden = true; statsBtn.setAttribute('aria-pressed', 'false'); cfgEl.hidden = false;
  if (test && test.finished) results.hidden = false;
  else { stage.hidden = false; $('#tip').hidden = false; layout(); focusInput(); }
}
statsBtn.addEventListener('click', () => statsView.hidden ? openStats() : closeStats());
$('#statsBack').addEventListener('click', closeStats);
$('#svCopy').addEventListener('click', () => {
  const dump = JSON.stringify({ app:'Glotkey', exported:new Date().toISOString(), history:store.get(HKEY, []), misses:store.get(MKEY, {}) });
  const area = $('#svDump'), say = s => { $('#svMsg').textContent = s; };
  const fallback = () => { area.hidden = false; area.value = dump; area.focus(); area.select(); say(t('selected')); };
  try { navigator.clipboard.writeText(dump).then(() => { area.hidden = true; say(t('dataCopied')); }, fallback); } catch (e) { fallback(); }
});
$('#svClear').addEventListener('click', () => { $('#svConfirm').hidden = false; $('#svMsg').textContent = ''; });
$('#svClearNo').addEventListener('click', () => { $('#svConfirm').hidden = true; });
$('#svClearYes').addEventListener('click', () => {
  try { localStorage.removeItem(HKEY); localStorage.removeItem(MKEY); localStorage.removeItem('typeglot-best2'); } catch (e) {}
  $('#svConfirm').hidden = true; $('#svMsg').textContent = t('dataCleared'); renderStats();
});

applyAppearance(); renderSound(); applyLayout(); applyI18n(); newTest(false);
})();
</script>
